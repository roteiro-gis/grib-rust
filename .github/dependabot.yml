version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /grib-reader/fuzz
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/New_York
    open-pull-requests-limit: 10
